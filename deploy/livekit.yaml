# LiveKit (voice and video) for Dendrop. The API key and secret come from LIVEKIT_KEYS in
# .env, so they live in one place with Dendrop's own settings.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Finds the public IP so calls work from outside the house. Set to false if every
  # caller is on your home network.
  use_external_ip: true
logging:
  level: info
