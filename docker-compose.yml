# Example deployment. Copy .env.example to .env, adjust it, then:
#   docker compose up -d            (uses the published image)
#   docker compose up -d --build    (builds from this folder instead)
services:
  dendrop:
    build: .
    image: ${DENDROP_IMAGE:-ghcr.io/spacegoose02/dendrop:latest}
    container_name: dendrop
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
      # Calls (the built-in LiveKit server). Keep the same numbers on both sides, and forward
      # them on your router for calls away from home.
      - "7881:7881"
      - "7882:7882/udp"
    env_file: .env
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata/dendrop}:/data
      # Dendrop's own backups (see docs/BACKUPS.md). Without it they go in /data/backups.
      - ${BACKUP_PATH:-/mnt/user/backups/dendrop}:/backups
